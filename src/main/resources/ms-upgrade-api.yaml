openapi: 3.0.1
info:
  title: Clients API
  version: 1.0.0
  description: Best of API

servers:
  - url: /api/v1
    description: basePath for access to API

paths:
  /clients:
    post:
      summary: Создание нового клиента
      operationId: createClient
      tags:
        - Clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
            example:
              mdmId: 1234567890
              firstName: Иван
              lastName: Петров
              middleName: Сергеевич
              citizenship: Москва
              clientType: ИП
              documentNumber: "1234567890"
              documentSeries: "1234"
              documentType: Паспорт
              mdmCode: 123456
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                mdmId: 1234567890
                firstName: Иван
                lastName: Петров
                middleName: Сергеевич
                status: ACTIVE
                createdAt: 2024-01-15T10:30:00Z
                updatedAt: 2024-01-15T10:30:00Z
        '400':
          description: Bad Request - невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: BAD_REQUEST
                errorDescription: Невалидные данные
                statusCode: 400
        '409':
          description: Conflict - клиент с таким mdmId уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: CONFLICT
                errorDescription: Клиент с таким mdmId уже существует
                statusCode: 409
    get:
      summary: Поиск клиентов с пагинацией и фильтрацией
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 0
            description: Номер страницы
        - in: query
          name: size
          schema:
            type: integer
            default: 20
            description: Размер страницы
        - in: query
          name: lastName
          schema:
            type: string
            description: Фильтр по фамилии
        - in: query
          name: mdmId
          schema:
            type: integer
            description: Фильтр по mdmId
      responses:
        '200':
          description: Клиент найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientWithPageInfo'
                  pageInfo:
                    $ref: '#/components/schemas/PageInfo'
                example:
                  content:
                    content:
                      - id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        mdmId: 1234567890
                        firstName: Иван
                        lastName: Петров
                        middleName: Сергеевич
                        status: ACTIVE
                      - id: b2c3d4e5-f678-90ab-cdef-123456789012
                        mdmId: 9876543210
                        firstName: Мария
                        lastName: Сидорова
                        middleName: Ивановна
                        status: BLOCKED
                  pageInfo:
                    pageNumber: 1
                    pageSize: 20
                    totalPages: 5
                    totalElements: 95

  /clients/{clientId}:
    get:
      summary: Получение клиента по ID
      operationId: getClientById
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: ID клиента (UUID)
      responses:
        '200':
          description: Client Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientDTO'
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                mdmId: 1234567890
                firstName: Иван
                lastName: Петров
                middleName: Сергеевич
                status: ACTIVE
                createdAt: 2024-01-15T10:30:00Z
                updatedAt: 2024-01-15T10:30:00Z
                hasAccounts: true
        '404':
          description: Not found - клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: NOT_FOUND
                errorDescription: Клиент не найден
                statusCode: 404

    patch:
      summary: Обновление клиента
      operationId: updateClientById
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            description: ID клиента (UUID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientData"
            example:
              firstName: Иван
              lastName: Петров
              middleName: Сергеевич
      responses:
        '200':
          description: Client Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                mdmId: 1234567890
                firstName: Иван
                lastName: Петров
                middleName: Сергеевич
                status: ACTIVE
                createdAt: 2024-01-15T10:30:00Z
                updatedAt: 2024-01-15T10:30:00Z
        '404':
          description: Not found - клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: NOT_FOUND
                errorDescription: Клиент не найден
                statusCode: 404
        '400':
          description: Bad Request - невалидные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: BAD_REQUEST
                errorDescription: Невалидные данные
                statusCode: 400

    delete:
      summary: Удаление клиента (soft delete)
      operationId: deleteClientById
      parameters:
        - in: path
          name: clientId
          schema:
            type: string
            format: uuid
          required: true
          description: ID клиента (UUID)
      responses:
        '204':
          description: Успешное удаление клиента (No Content)
        '404':
          description: Not found - клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: NOT_FOUND
                errorDescription: Клиент не найден
                statusCode: 404
        '409':
          description: Conflict - у клиента есть активные счета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: CONFLICT
                errorDescription: У клиента есть активные счета
                statusCode: 409

  /clients/{clientId}/exists:
    get:
      summary: Проверка существования клиента
      operationId: checkClientExists
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Client Exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    description: true, если клиент существует, иначе false
                    example: true
                  clientId:
                    type: string
                    format: uuid
                    description: ID клиента
                    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  status:
                    type: string
                    enum: [ ACTIVE, BLOCKED, DELETED ]
                    description: Статус клиента
                    example: ACTIVE
        '404':
          description: Not found - клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: NOT_FOUND
                errorDescription: Клиент не найден
                statusCode: 404

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ClientData:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          nullable: false
        mdmId:
          type: integer
          format: int64
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        middleName:
          type: string
          nullable: true
    ClientCreate:
      type: object
      allOf:
        - $ref: '#/components/schemas/ClientData'
      properties:
        citizenship:
          type: string
        clientType:
          type: string
        documentNumber:
          type: string
        documentSeries:
          type: string
        documentType:
          type: string
        mdmCode:
          type: integer
          format: int64
    ClientDTO:
      allOf:
        - $ref: '#/components/schemas/Client'
      type: object
      properties:
        hasAccounts:
          type: boolean
          example: false
    ClientWithPageInfo:
      type: object
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
        status:
          type: string
          enum: [ ACTIVE, BLOCKED, DELETED ]
      allOf:
        - $ref: '#/components/schemas/ClientData'
        - $ref: '#/components/schemas/PageInfo'
    PageInfo:
      properties:
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        totalElements:
          type: integer
    Client:
      allOf:
        - $ref: '#/components/schemas/ClientData'
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ ACTIVE, BLOCKED, DELETED ]
    ErrorCode:
      type: string
      description: Мнемокод ошибки
      enum:
        - BAD_REQUEST
        - CONFLICT
        - NOT_FOUND
    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorDescription
        - statusCode
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        errorDescription:
          type: string
        statusCode:
          type: integer
      example:
        errorCode: BAD_REQUEST
        errorDescription: Невалидные данные