spring:
  datasource:
    url: ${MS_UPDATE_DB}
    username: ${MS_UPDATE_DB_USERNAME}
    password: ${MS_UPDATE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${MINIMUM_IDLE}
      maximum-pool-size: ${MAXIMUM_POOL_SIZE}
      connection-timeout: ${CONNECTION_TIMEOUT}
      idle-timeout: ${IDLE_TIMEOUT}
      max-lifetime: ${MAX_LIFETIME}
      leak-detection-threshold: ${LEAK_DETECTION_THRESHOLD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${MS_UPDATE_HIBERNATE_DDL_AUTO}
    show-sql: ${MS_UPDATE_SHOW_SQL}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: ${LIQUIBASE_ENABLED}
    change-log: classpath:/db/changelog/db.changelog-master.xml
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    cache-names: rates
    type: redis
    redis:
      time-to-live: 30m
management:
  endpoints:
    web:
      exposure:
        include: health, info, threaddump,prometheus
  server:
    port: ${MANAGEMENT_PORT}
  endpoint:
    health:
      show-details: always
server:
  port: ${APP_PORT}




currency-client-starter:
  enabled: ${CURRENCY_CLIENT_STARTER_ENABLED}
  api-key: ${CURRENCY_CLIENT_STARTER_API_KEY}
  base-url: ${CURRENCY_CLIENT_STARTER_BASE_URL}
  retry:
    enabled: ${CURRENCY_CLIENT_STARTER_RETRY_ENABLED}
    max-attempts: ${CURRENCY_CLIENT_STARTER_RETRY_MAX_ATTEMPTS}
    backoff: ${CURRENCY_CLIENT_STARTER_RETRY_BACKOFF}
  health:
    enabled: ${CURRENCY_CLIENT_STARTER_HEALTH_ENABLED}